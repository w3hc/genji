name: Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Informational only: never fails the build (see continue-on-error).
      # A project generated from the template carries templateVersion in its
      # package.json (customize.js writes it, genji-sync updates it); this
      # compares that against the newest tag upstream. genji itself has no
      # templateVersion, so it instead catches a tag pushed without bumping
      # its own version — the field new projects read to write theirs.
      - name: Check template version
        continue-on-error: true
        run: |
          LATEST=$(git ls-remote --tags --sort=-v:refname \
            https://github.com/w3hc/genji 'v*' \
            | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')

          if [ -z "$LATEST" ]; then
            echo "Could not read upstream tags, skipping."
            exit 0
          fi

          TPL="$(node -p "require('./package.json').templateVersion || ''")"

          # Legacy: projects generated before templateVersion moved into
          # package.json still carry a .genji-version file. genji-sync
          # migrates them on the next sync.
          if [ -z "$TPL" ] && [ -f .genji-version ]; then
            TPL="$(cat .genji-version)"
          fi

          if [ -n "$TPL" ]; then
            CURRENT="v$TPL"
            if [ "$CURRENT" != "$LATEST" ]; then
              echo "::warning::Template update available: $CURRENT → $LATEST. Run /genji-sync to merge it in."
            else
              echo "Up to date with genji $LATEST."
            fi
          else
            DECLARED="v$(node -p "require('./package.json').version || ''")"
            OLDEST=$(printf '%s\n%s\n' "$DECLARED" "$LATEST" | sort -V | head -1)
            if [ "$DECLARED" != "v" ] && [ "$DECLARED" != "$LATEST" ] && [ "$OLDEST" = "$DECLARED" ]; then
              echo "::warning::package.json version is $DECLARED but $LATEST is tagged. Bump it — new projects read it to write their templateVersion."
            fi
          fi

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Run lint
        run: pnpm lint

      - name: Check format
        run: pnpm format:check